<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A111C" />
    <title>FlowLo — Offline</title>
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      :root {
        --ink: #0A111C;
        --heading: #F8FBFE;
        --text: #EAF1F7;
        --muted: #8FA1B3;
        --mint: #4EE6C1;
        --sky: #4EC3E6;
        --line: rgba(148, 178, 205, 0.12);
        --grad: linear-gradient(96deg, #4EE6C1 0%, #4EC3E6 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(560px 420px at 85% -8%, rgba(78, 230, 193, .13), transparent 65%),
          radial-gradient(600px 460px at -14% 40%, rgba(78, 195, 230, .10), transparent 65%),
          var(--ink);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }

      main {
        width: min(100%, 430px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }

      .logo {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 9px;
        background: var(--grad);
        color: white;
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        font-weight: 700;
      }

      .wordmark {
        color: var(--heading);
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        font-weight: 600;
      }

      .wordmark em {
        color: var(--mint);
        font-style: normal;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(20, 30, 46, .66);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 28px rgba(2, 6, 12, .38);
        padding: 22px;
        backdrop-filter: blur(18px) saturate(1.35);
        -webkit-backdrop-filter: blur(18px) saturate(1.35);
      }

      h1 {
        margin: 0 0 10px;
        color: var(--heading);
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        font-size: clamp(32px, 9vw, 38px);
        line-height: 1.06;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="logo">F</div>
        <div class="wordmark">Flow<em>Lo</em></div>
      </div>
      <section class="card">
        <h1>You're offline</h1>
        <p>FlowLo could not reach the network. Reconnect and refresh to continue your flow.</p>
      </section>
    </main>
  </body>
</html>
